name: m18_residences_shared
description: "Shared models, API client and widgets for the M18 Residences admin and tenant apps."
version: 0.6.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  http_parser: ^4.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # The HEIC decoder (LGPL-3.0), fetched by the browser only when a HEIC photo is picked.
    - assets/heic-to/heic-to.js
